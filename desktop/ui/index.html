<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switchboard</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f2; --fg: #1d1d1b; --mute: #5f5f5b; --line: #d6d6d1; --warn: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --fg: #ececea; --mute: #a3a3a0; --line: #34343a; --warn: #f2b8b5; } }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
      font: 15px/1.6 "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
    main { height: 100%; display: grid; place-content: center; padding: 0 24px; max-width: 560px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 6px 0; color: var(--mute); }
    code { background: color-mix(in srgb, var(--fg) 8%, transparent); padding: 1px 6px; border-radius: 4px; word-break: break-all; }
    .err h1 { color: var(--warn); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main id="root" role="status" aria-live="polite"></main>
  <script src="status.js"></script>
</body>
</html>
